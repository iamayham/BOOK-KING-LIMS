<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B07154">
  <title>Book King - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Montserrat, Arial, sans-serif;
      background: linear-gradient(180deg, #fdf8f4 0%, #fff 100%);
      color: #2d2d2d;
      padding: 20px;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid rgba(176, 113, 84, 0.2);
      box-shadow: 0 10px 28px rgba(176, 113, 84, 0.12);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      margin: 0 auto 12px;
      display: block;
      object-fit: contain;
      background: #fff3ea;
      padding: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #8f5b43;
    }
    p {
      margin: 0;
      line-height: 1.6;
      font-size: 14px;
      color: #5f5f5f;
    }
    .btn {
      margin-top: 16px;
      display: inline-block;
      border: 0;
      border-radius: 10px;
      background: #b07154;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/logo.png" alt="Book King">
    <h1>You're offline</h1>
    <p>Book King is not connected right now. Check your internet and try again.</p>
    <a class="btn" href="/index.php">Try Again</a>
  </main>
</body>
</html>
